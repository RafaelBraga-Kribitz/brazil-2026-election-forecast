[project]
name = "brazil-2026-forecast"
version = "0.1.0"
description = "Pre-registered Bayesian poll-aggregation forecast of the 2026 Brazilian presidential election, with leave-one-election-out historical backtests and baseline comparison."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Rafael Braga-Kribitz" }]
dependencies = [
    "pymc==5.27.1",
    "pytensor==2.37.0",
    "arviz==0.23.4",
    "xarray==2026.4.0",
    "numba==0.65.1",
    "llvmlite==0.47.0",
    "numpy==2.4.4",
    "pandas==2.3.3",
    "scipy==1.17.1",
    "matplotlib==3.10.9",
    "pillow==12.2.0",
    "kiwisolver==1.5.0",
    "contourpy==1.3.3",
    "pyyaml>=6.0",
    "requests>=2.32",
    "lxml==6.1.3",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brfc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs MCMC (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
